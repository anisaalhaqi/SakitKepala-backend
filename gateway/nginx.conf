# Gateway: rate limit per IP klien. Di balik Cloudflare Tunnel, IP asli ada di header CF-Connecting-IP.
# Port gateway TIDAK dipublikasikan ke host; hanya container tunnel yang bisa mengaksesnya.
map $http_cf_connecting_ip $client_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

limit_req_zone $client_key zone=api:10m  rate=10r/s;
limit_req_zone $client_key zone=auth:10m rate=1r/s;   # lebih ketat: cegah tebak password

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://core-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_key;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://core-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_key;
        proxy_read_timeout 60s;   # panggilan AI bisa lambat
    }

    location / {
        return 404;
    }
}
